<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Code 供应商切换器</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // ArkWeb 自定义 scheme（tauri://localhost）下 window.localStorage 为 null。
      // 必须在任何 ES module（i18n 等）执行前安装内存降级实现，否则模块顶层
      // 读 localStorage 会抛 TypeError。重启不持久化，仅保证可用性。
      if (typeof window !== "undefined" && !window.localStorage) {
        var __ls = (function () {
          var map = new Map();
          return {
            getItem: function (k) { return map.has(k) ? map.get(k) : null; },
            setItem: function (k, v) { map.set(String(k), String(v)); },
            removeItem: function (k) { map.delete(k); },
            clear: function () { map.clear(); },
            key: function (i) { return Array.from(map.keys())[i] ?? null; },
            get length() { return map.size; },
          };
        })();
        Object.defineProperty(window, "localStorage", {
          value: __ls, configurable: true, writable: true,
        });
      }
    </script>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
